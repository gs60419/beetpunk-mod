<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>甜菜文明樹｜甜菜龐克</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tree.css">
</head>
<body class="craft-tree-page">
  <header class="site-header tree-header">
    <a class="brand" href="index.html" aria-label="返回甜菜龐克首頁"><span class="brand-mark">B</span><span><strong>甜菜龐克</strong><small>BEETPUNK</small></span></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">選單</button>
    <nav id="site-nav" aria-label="主要導覽"><a href="index.html#route">生存路線</a><a class="active" href="#civilization-tree">合成樹</a><a href="temples.html">十三神殿</a><a class="nav-github" href="https://github.com/gs60419/beetpunk-mod">GitHub ↗</a></nav>
  </header>

  <main id="top">
    <section class="tree-hero">
      <p class="section-kicker">THE BEET CIVILIZATION TREE</p>
      <h1>甜菜向下扎根，<br><em>文明沿枝節生長。</em></h1>
      <p>預設只看見三條主根。親手點開一段段枝脈，探索一株甜菜如何變成布料、農業、石材、機械與神殿。</p>
      <div class="tree-hero-stats"><span><b>147</b> 工作台配方</span><span><b>8</b> 轉經加工</span><span><b>3</b> 文明主根</span></div>
    </section>

    <section class="tree-tools" aria-label="合成樹工具">
      <div class="mode-switch" role="group" aria-label="顯示模式"><button class="active" data-mode="trunk">主幹探索</button><button data-mode="full">全部展開</button></div>
      <div class="quick-lookup">
        <label for="quick-search"><span>遊玩中快速查詢</span><kbd>/</kbd></label>
        <div class="lookup-input"><input id="quick-search" type="search" placeholder="輸入物品名稱，一次點開配方…" autocomplete="off"><button id="clear-search" aria-label="清除搜尋">×</button></div>
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <p id="tree-status" class="tree-status">主幹模式 · 點擊枝幹逐一展開</p>
    </section>

    <section id="civilization-tree" class="civilization-tree" aria-live="polite">
      <div class="tree-loading">正在讓甜菜生根……</div>
    </section>
    <a class="developer-entry" href="dev-tree.html"><span>DEVELOPER VIEW</span><strong>查看由上而下的配方依賴與成本圖 →</strong></a>
  </main>

  <aside id="lookup-drawer" class="lookup-drawer" aria-hidden="true" aria-label="物品快速查詢結果">
    <button class="drawer-close" aria-label="關閉查詢">×</button>
    <div id="lookup-content"></div>
  </aside>
  <div class="drawer-backdrop" hidden></div>

  <footer><p>BEETPUNK · CIVILIZATION TREE</p><p>配方資料由模組原始檔自動產生</p></footer>
