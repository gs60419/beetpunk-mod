name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate-site-data.mjs"
      - "src/main/resources/data/beetpunk/recipe/**"
      - "src/main/resources/assets/beetpunk/lang/zh_tw.json"
      - "src/main/resources/assets/beetpunk/textures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate recipe data and icons
        run: node scripts/generate-site-data.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
